name: Rebuild UF2 for all tags

on:
  workflow_dispatch: # run manually only

jobs:
  build-all-tags:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # important: fetch all tags

      - name: Get all tags
        id: tags
        run: |
          tags=$(git tag)
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "$tags" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build all tags
        uses: actions/github-script@v7
        with:
          script: |
            const tags = `${{ steps.tags.outputs.tags }}`.split("\n").filter(t => t);
            for (const tag of tags) {
              console.log(`::group::Building ${tag}`);
              await exec.getExecOutput("git", ["checkout", tag]);
              await exec.getExecOutput("cmake", ["-S", ".", "-B", "build", "-DPICO_SDK_FETCH_FROM_GIT=on"]);
              await exec.getExecOutput("cmake", ["--build", "build", "--parallel"]);
              await exec.getExecOutput("gh", [
                "release", "upload", tag, "build/*.uf2",
                "--clobber"
              ]);
              console.log(`::endgroup::`);
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
